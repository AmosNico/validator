name = "validator"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Validator"]

# TODO: use linter
# lintDriver = "batteries/runLinter"
linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "Parser"
git = "https://github.com/AmosNico/lean4-parser"
# git = "https://github.com/fgdorais/lean4-parser"
rev = "57874a1f4ff2cc9913ebc0c6f0d8cb85690b8ebf"

[[require]]
name = "bdd"
# git = "https://github.com/eshelyaron/lean4-bdd"
git = "https://github.com/AmosNico/lean4-bdd"
rev = "parser-v4.33.0"

[[require]]
name = "strips"
git = "https://github.com/AmosNico/lean4-strips"
rev = "v4.33.0"

[[lean_lib]]
name = "Validator"

[[lean_exe]]
name = "validator"
root = "Validator"