name = "validator"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Validator"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "2707e2625e3765493d3c88d3371c6c3f28309979"

[[require]]
name = "bdd"
# git = "https://github.com/eshelyaron/lean4-bdd"
git = "https://github.com/AmosNico/lean4-bdd"
rev = "main"

[[lean_lib]]
name = "Validator"

[[lean_exe]]
name = "validator"
root = "Validator"