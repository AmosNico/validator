name = "validator"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Validator"]

# TODO: use linter
# lintDriver = "batteries/runLinter"
linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "Parser"
git = "https://github.com/AmosNico/lean4-parser"
# git = "https://github.com/fgdorais/lean4-parser"
rev = "40ccb6dcacdcdb9bf1c403225ed80827003e626a"

[[require]]
name = "bdd"
# git = "https://github.com/eshelyaron/lean4-bdd"
git = "https://github.com/AmosNico/lean4-bdd"
rev = "parser"

[[require]]
name = "strips"
git = "https://github.com/AmosNico/lean4-strips"
rev = "main"

[[lean_lib]]
name = "Validator"

[[lean_exe]]
name = "validator"
root = "Validator"